# =========================================================
# Perfil ORACLE - banco ORACLE_FIAP (mesmo BD usado na Parte 1)
# =========================================================
# As credenciais sao lidas de variaveis de ambiente para nao ficarem
# expostas no codigo/GitHub. Ao rodar localmente, defina-as no seu
# terminal ou no "Run Configuration" da sua IDE (IntelliJ/Eclipse/NetBeans):
#
#   export DB_USER=RM565960
#   export DB_PASSWORD=informar_a_senha_do_oracle_fiap
#
# Caso as variaveis nao sejam definidas, os valores apos ":" abaixo
# sao usados como padrao (mesmos utilizados na Parte 1).

spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.username=${DB_USER:RM565960}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ddl-auto=none -> a tabela e criada manualmente via scripts/create_table.sql
# (mesma pratica adotada na Parte 1, ja que o usuario do Oracle FIAP em geral
# nao tem permissao de DDL automatico pelo Hibernate).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
