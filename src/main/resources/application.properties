# =========================================================
# Mercado Express MVC - Configuracao principal
# Checkpoint 4 - Parte 2 (MVC e Deploy) - TDS FIAP
# =========================================================

spring.application.name=mercado-express-mvc
server.port=8083

# Perfil ativo por padrao: "oracle" (banco ORACLE_FIAP, mesmo da Parte 1).
# Para rodar localmente sem acesso a rede da FIAP, use o perfil "h2":
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Em producao (Render), o perfil e escolhido pela variavel de ambiente
# SPRING_PROFILES_ACTIVE (ver README / render.yaml).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:oracle}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
